<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        #chat-messages {
            font-family: Arial, sans-serif;
        }
        .message {
            margin: 5px 0;
            padding: 8px;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        .message.self {
            background-color: #e0f7fa;
            text-align: right;
        }
        .message.error {
            color: red;
        }
        small.time {
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>WebSocket Test</h1>
    <p>Open the browser console to see WebSocket messages.</p>
    <div>
        <p>Registration</p>
        <label for="username">username:</label>
        <input type="text" id="reg_username">
        <label for="password">password:</label>
        <input type="password" id="reg_password">
        <button onclick="registration_button()">sign up</button>
    </div>
    <div>
        <p>Authorization</p>
        <label for="username">username:</label>
        <input type="text" id="username">
        <label for="password">password:</label>
        <input type="password" id="password">
        <button onclick="authorization_button()">log in</button>
    </div>
    <div>
        <p>Sending messages</p>
        <label for="message">message:</label>
        <input type="text" id="message">
        <label for="receiver">to:</label>
        <input type="text" id="receiver">
        <button onclick="send_message_button()">send message</button>
    </div>
    <div id="chat-messages" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;">
        <h3>Chat Messages</h3>
    </div>
    <script src="main.js"></script>
</body>
</html>
